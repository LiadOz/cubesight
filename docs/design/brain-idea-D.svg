<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101820"/><stop offset="1" stop-color="#0b1016"/></linearGradient>
    <linearGradient id="fU" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cdd4dc"/></linearGradient>
    <linearGradient id="fF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00b357"/><stop offset="1" stop-color="#007a3c"/></linearGradient>
    <linearGradient id="fR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4a40"/><stop offset="1" stop-color="#c02420"/></linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1c2935"/><stop offset="1" stop-color="#161f29"/></linearGradient>
    <filter id="shadow" x1="-20%" y1="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="14"/><feOffset dx="0" dy="16" result="b"/><feFlood flood-color="#000" flood-opacity="0.5"/><feComposite in2="SourceGraphic" operator="in"/></filter>
  </defs>
  <rect width="1280" height="820" fill="url(#bg)"/>
  <text x="40" y="50" fill="#e3ebf3" font-size="22" font-weight="700">Brain</text>
  <text x="1240" y="50" fill="#66dfc5" font-size="13" text-anchor="end">idea D · one continuous glass rail (no separate boxes)</text>

  <!-- ===== CLEAN ISOMETRIC CUBE ===== -->
  <g transform="translate(470,310)" filter="url(#shadow)">
    <ellipse cx="0" cy="250" rx="180" ry="34" fill="#000" opacity="0.35"/>
    <polygon points="0,-92 160,0 0,92 -160,0" fill="url(#fU)" stroke="#0c1218" stroke-width="1.5"/>
    <polygon points="160,0 160,140 0,232 0,92" fill="url(#fR)" stroke="#0c1218" stroke-width="1.5"/>
    <polygon points="-160,0 -160,140 0,232 0,92" fill="url(#fF)" stroke="#0c1218" stroke-width="1.5"/>
    <g stroke="#0c1218" stroke-width="0.8" opacity="0.18"><line x1="0" y1="-92" x2="0" y2="92"/><line x1="-160" y1="0" x2="160" y2="0"/><line x1="-53" y1="-31" x2="53" y2="31"/><line x1="53" y1="-31" x2="-53" y2="31"/></g>
  </g>
  <!-- floating timer chip beside cube -->
  <g transform="translate(650,250)">
    <rect x="0" y="0" width="170" height="64" rx="14" fill="#1a2632" stroke="#304451"/>
    <text x="14" y="46" fill="#e3ebf3" font-size="24" font-weight="700">8.42<tspan fill="#a6b6c6" font-size="13"> s</tspan></text>
    <text x="160" y="26" fill="#66dfc5" font-size="10" text-anchor="end">12 mv · 4.31 TPS</text>
  </g>

  <!-- flowing scramble under cube -->
  <g transform="translate(160,560)">
    <text x="0" y="0" fill="#a6b6c6" font-size="10" letter-spacing="1">SCRAMBLE</text>
    <path d="M 20 30 C 90 30 110 30 160 30" fill="none" stroke="#304451" stroke-width="2"/>
    <path d="M 160 30 C 210 30 240 30 300 30 360 30 410 30 470 30 520 30 580 30 620 30" fill="none" stroke="#304451" stroke-width="2"/>
    <circle cx="20" cy="30" r="5" fill="#3a4754"/><circle cx="80" cy="30" r="5" fill="#3a4754"/>
    <circle cx="160" cy="30" r="11" fill="#087f75" stroke="#66dfc5" stroke-width="2"/>
    <text x="160" y="11" text-anchor="middle" fill="#66dfc5" font-size="11" font-weight="700">F2</text>
    <circle cx="240" cy="30" r="4" fill="#2a3744"/><circle cx="300" cy="30" r="4" fill="#2a3744"/><circle cx="360" cy="30" r="4" fill="#2a3744"/><circle cx="410" cy="30" r="4" fill="#2a3744"/><circle cx="470" cy="30" r="4" fill="#2a3744"/><circle cx="520" cy="30" r="4" fill="#2a3744"/><circle cx="580" cy="30" r="4" fill="#2a3744"/><circle cx="620" cy="30" r="4" fill="#2a3744"/>
  </g>

  <!-- ===== ONE continuous glass rail on the right — sections separated by hairlines, NOT separate boxes ===== -->
  <g transform="translate(860,96)">
    <rect x="0" y="0" width="380" height="660" rx="18" fill="url(#rail)" stroke="#30404e"/>
    <!-- connection section -->
    <g transform="translate(0,0)">
      <circle cx="26" cy="34" r="7" fill="#0f9d58"/>
      <text x="46" y="30" fill="#e3ebf3" font-size="13" font-weight="700">GAN16ui_B704</text>
      <text x="46" y="50" fill="#a6b6c6" font-size="11">GAN Gen4 · Disconnect</text>
    </g>
    <line x1="20" y1="78" x2="360" y2="78" stroke="#30404e" stroke-width="1"/>
    <!-- setup section -->
    <g transform="translate(0,90)">
      <text x="22" y="14" fill="#a6b6c6" font-size="10" letter-spacing="1">SETUP</text>
      <g transform="translate(22,24)" font-size="11">
        <rect x="0" y="0" width="96" height="26" rx="7" fill="#22313e"/><rect x="2" y="2" width="46" height="22" rx="5" fill="#304451"/><text x="25" y="17" text-anchor="middle" fill="#e3ebf3">Guided</text><text x="72" y="17" text-anchor="middle" fill="#a6b6c6">Free</text>
        <rect x="108" y="0" width="180" height="26" rx="7" fill="#22313e"/><text x="124" y="17" text-anchor="middle" fill="#a6b6c6">Cross</text><text x="186" y="17" text-anchor="middle" fill="#a6b6c6">X-cross</text><text x="244" y="17" text-anchor="middle" fill="#a6b6c6">Double X</text>
      </g>
      <g transform="translate(22,62)" font-size="11" fill="#a6b6c6"><rect x="0" y="0" width="12" height="12" rx="3" fill="none" stroke="#66dfc5"/><text x="20" y="10" fill="#e3ebf3">Pseudo F2L · D-shift</text>
      <rect x="190" y="0" width="12" height="12" rx="3" fill="#087f75" stroke="#66dfc5"/><text x="210" y="10" fill="#e3ebf3">Inspection · 15s</text></g>
      <rect x="22" y="88" width="336" height="40" rx="9" fill="#087f75"/><text x="190" y="113" text-anchor="middle" fill="#102923" font-size="13" font-weight="700">Start guided solve</text>
    </g>
    <line x1="20" y1="196" x2="360" y2="196" stroke="#30404e" stroke-width="1"/>
    <!-- phase section -->
    <g transform="translate(0,208)">
      <text x="22" y="14" fill="#a6b6c6" font-size="10" letter-spacing="1">PHASE</text>
      <text x="22" y="40" fill="#e3ebf3" font-size="18" font-weight="700">F2L · 2/4 pairs</text>
      <g transform="translate(22,52)"><rect x="0" y="0" width="80" height="22" rx="6" fill="#0f9d58"/><text x="40" y="15" text-anchor="middle" fill="#fff" font-size="10">Cross</text><rect x="88" y="0" width="80" height="22" rx="6" fill="#304451"/><text x="128" y="15" text-anchor="middle" fill="#a6b6c6" font-size="10">F2L 2/4</text><rect x="176" y="0" width="74" height="22" rx="6" fill="#19242f" stroke="#30404e"/><text x="213" y="15" text-anchor="middle" fill="#a6b6c6" font-size="10">OLL</text></g>
    </g>
    <line x1="20" y1="316" x2="360" y2="316" stroke="#30404e" stroke-width="1"/>
    <!-- coach section -->
    <g transform="translate(0,328)">
      <text x="22" y="14" fill="#a6b6c6" font-size="10" letter-spacing="1">COACH</text>
      <g transform="translate(22,26)" font-size="11" fill="#e3ebf3">
        <text x="0" y="14" fill="#83e7b3">✓ Optimal cross: White face in 5 moves.</text>
        <text x="0" y="36" fill="#ffd27a">Your D cross took 7 moves. Optimal is 5.</text>
        <text x="0" y="58">The FR pair is already connected — insert it.</text>
        <text x="0" y="80">PLL: T · One adjacent pair of headlights…</text>
        <text x="0" y="102" fill="#a6b6c6">3 rotations this solve — fewer often saves time.</text>
      </g>
    </g>
    <line x1="20" y1="464" x2="360" y2="464" stroke="#30404e" stroke-width="1"/>
    <!-- metrics section -->
    <g transform="translate(0,476)">
      <text x="22" y="14" fill="#a6b6c6" font-size="10" letter-spacing="1">METRICS</text>
      <g transform="translate(22,26)" font-size="11" fill="#e3ebf3">
        <text x="0" y="10" fill="#a6b6c6" font-size="9">SOLVES</text><text x="0" y="30" font-size="15" font-weight="700">12</text>
        <text x="64" y="10" fill="#a6b6c6" font-size="9">BEST</text><text x="64" y="30" font-size="15" font-weight="700">8.42s</text>
        <text x="130" y="10" fill="#a6b6c6" font-size="9">AO5</text><text x="130" y="30" font-size="15" font-weight="700">9.10s</text>
        <text x="196" y="10" fill="#a6b6c6" font-size="9">AO12</text><text x="196" y="30" font-size="15" font-weight="700">9.30s</text>
        <text x="268" y="10" fill="#a6b6c6" font-size="9">MED TPS</text><text x="268" y="30" font-size="15" font-weight="700">4.31</text>
      </g>
    </g>
    <line x1="20" y1="556" x2="360" y2="556" stroke="#30404e" stroke-width="1"/>
    <g transform="translate(0,568)"><text x="22" y="14" fill="#a6b6c6" font-size="10">▸ Diagnostics · ▸ Coach settings</text></g>
  </g>
</svg>
