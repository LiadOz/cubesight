        - 'listitem "Move 4 of 21: B2. Turn the back face (blue center) 180° (looking directly at that face)."': B2
        - 'listitem "Move 5 of 21: R. Turn the right face (red center) clockwise (looking directly at that face)."': R
        - 'listitem "Move 6 of 21: F2. Turn the front face (green center) 180° (looking directly at that face)."': F2
        - 'listitem "Move 7 of 21: R. Turn the right face (red center) clockwise (looking directly at that face)."': R
        - 'listitem "Move 8 of 21: D2. Turn the bottom face (yellow center) 180° (looking directly at that face)."': D2
