      - option "0.5×"
      - option "1×" [selected]
      - option "2×"
      - option "4×"
    - status: 21 / 21
  - 'button "timer: touch and hold, release to start"':
    - group "Manual timer":
      - list "Manual timer":
        - listitem "solve, 1.59":
          - button "solve, 1.59"
        - text: solve 1.59
