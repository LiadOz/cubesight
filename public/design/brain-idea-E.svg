<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101820"/><stop offset="1" stop-color="#0b1016"/></linearGradient>
    <linearGradient id="fU" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cdd4dc"/></linearGradient>
    <linearGradient id="fF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00b357"/><stop offset="1" stop-color="#007a3c"/></linearGradient>
    <linearGradient id="fR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4a40"/><stop offset="1" stop-color="#c02420"/></linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2632" stop-opacity="0.95"/><stop offset="1" stop-color="#141d26" stop-opacity="0.95"/></linearGradient>
    <filter id="shadow" x1="-20%" y1="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="14"/><feOffset dx="0" dy="16" result="b"/><feFlood flood-color="#000" flood-opacity="0.5"/><feComposite in2="SourceGraphic" operator="in"/></filter>
  </defs>
  <rect width="1280" height="820" fill="url(#bg)"/>
  <text x="40" y="50" fill="#e3ebf3" font-size="22" font-weight="700">Brain</text>
  <text x="1240" y="50" fill="#66dfc5" font-size="13" text-anchor="end">idea E · bottom-center pill HUD (sides totally clear)</text>

  <!-- top-right tiny chips: connection + setup, no side boxes -->
  <g transform="translate(1000,90)">
    <circle cx="8" cy="10" r="6" fill="#0f9d58"/>
    <text x="22" y="14" fill="#e3ebf3" font-size="11" font-weight="700">GAN16ui_B704</text>
    <text x="150" y="14" fill="#66dfc5" font-size="10">Disconnect</text>
  </g>
  <g transform="translate(1000,118)">
    <text x="0" y="14" fill="#a6b6c6" font-size="10">SETUP ›</text>
    <text x="0" y="34" fill="#e3ebf3" font-size="11">Guided · Cross · Inspect 15s</text>
  </g>

  <!-- ===== CLEAN ISOMETRIC CUBE (big, centered, sides empty) ===== -->
  <g transform="translate(640,300)" filter="url(#shadow)">
    <ellipse cx="0" cy="250" rx="190" ry="36" fill="#000" opacity="0.35"/>
    <polygon points="0,-92 160,0 0,92 -160,0" fill="url(#fU)" stroke="#0c1218" stroke-width="1.5"/>
    <polygon points="160,0 160,140 0,232 0,92" fill="url(#fR)" stroke="#0c1218" stroke-width="1.5"/>
    <polygon points="-160,0 -160,140 0,232 0,92" fill="url(#fF)" stroke="#0c1218" stroke-width="1.5"/>
    <g stroke="#0c1218" stroke-width="0.8" opacity="0.18"><line x1="0" y1="-92" x2="0" y2="92"/><line x1="-160" y1="0" x2="160" y2="0"/><line x1="-53" y1="-31" x2="53" y2="31"/><line x1="53" y1="-31" x2="-53" y2="31"/></g>
  </g>
  <!-- timer floating top-right of cube (no box around it, just text + chip) -->
  <g transform="translate(840,250)">
    <circle cx="0" cy="6" r="6" fill="#0f9d58"/>
    <text x="14" y="10" fill="#e3ebf3" font-size="24" font-weight="700">8.42<tspan fill="#a6b6c6" font-size="13"> s · 12 mv · 4.31 TPS</tspan></text>
  </g>
  <text x="440" y="250" fill="#e3ebf3" font-size="18" font-weight="700">F2L · 2/4 pairs</text>

  <!-- flowing scramble under cube -->
  <g transform="translate(330,560)">
    <text x="0" y="0" fill="#a6b6c6" font-size="10" letter-spacing="1">SCRAMBLE</text>
    <path d="M 20 30 C 90 30 110 30 160 30" fill="none" stroke="#304451" stroke-width="2"/>
    <path d="M 160 30 C 210 30 240 30 300 30 360 30 410 30 470 30 520 30 580 30 620 30" fill="none" stroke="#304451" stroke-width="2"/>
    <circle cx="20" cy="30" r="5" fill="#3a4754"/><circle cx="80" cy="30" r="5" fill="#3a4754"/>
    <circle cx="160" cy="30" r="11" fill="#087f75" stroke="#66dfc5" stroke-width="2"/>
    <text x="160" y="11" text-anchor="middle" fill="#66dfc5" font-size="11" font-weight="700">F2</text>
    <circle cx="240" cy="30" r="4" fill="#2a3744"/><circle cx="300" cy="30" r="4" fill="#2a3744"/><circle cx="360" cy="30" r="4" fill="#2a3744"/><circle cx="410" cy="30" r="4" fill="#2a3744"/><circle cx="470" cy="30" r="4" fill="#2a3744"/><circle cx="520" cy="30" r="4" fill="#2a3744"/><circle cx="580" cy="30" r="4" fill="#2a3744"/><circle cx="620" cy="30" r="4" fill="#2a3744"/>
  </g>

  <!-- ===== BOTTOM-CENTER PILL HUD (one rounded pill under the cube; sides stay totally empty) ===== -->
  <g transform="translate(140,640)">
    <rect x="0" y="0" width="1000" height="130" rx="20" fill="url(#pill)" stroke="#304451"/>
    <!-- left: phase + live counter -->
    <g transform="translate(28,24)">
      <text x="0" y="14" fill="#a6b6c6" font-size="10" letter-spacing="1">PHASE</text>
      <text x="0" y="42" fill="#e3ebf3" font-size="22" font-weight="700">F2L · 2/4</text>
      <text x="0" y="68" fill="#66dfc5" font-size="12">12 turns · 4.31 TPS · 8.42s</text>
    </g>
    <line x1="240" y1="22" x2="240" y2="108" stroke="#30404e" stroke-width="1"/>
    <!-- middle: coach (a couple lines, inline) -->
    <g transform="translate(264,28)" font-size="11" fill="#e3ebf3">
      <text x="0" y="12" fill="#83e7b3">✓ Optimal cross: White in 5 moves.</text>
      <text x="0" y="34" fill="#ffd27a">Your D cross: 7 moves · optimal 5.</text>
      <text x="0" y="56">FR pair already connected — insert it.</text>
      <text x="0" y="78">PLL: T · one adjacent pair of headlights…</text>
    </g>
    <line x1="690" y1="22" x2="690" y2="108" stroke="#30404e" stroke-width="1"/>
    <!-- right: metrics inline, no boxes -->
    <g transform="translate(712,28)" font-size="11" fill="#e3ebf3">
      <text x="0" y="0" fill="#a6b6c6" font-size="9">SOLVES</text><text x="0" y="22" font-size="18" font-weight="700">12</text>
      <text x="64" y="0" fill="#a6b6c6" font-size="9">BEST</text><text x="64" y="22" font-size="18" font-weight="700">8.42s</text>
      <text x="150" y="0" fill="#a6b6c6" font-size="9">AO5</text><text x="150" y="22" font-size="18" font-weight="700">9.10s</text>
      <text x="0" y="50" fill="#a6b6c6" font-size="9">MED TPS</text><text x="0" y="72" font-size="14">4.31</text>
      <text x="120" y="50" fill="#a6b6c6" font-size="9">MED MV</text><text x="120" y="72" font-size="14">54</text>
    </g>
  </g>

  <!-- phone note -->
  <g transform="translate(40,790)"><text x="0" y="0" fill="#a6b6c6" font-size="10">PHONE: same pill docks to the bottom as a swipeable sheet; cube fills the screen above it.</text></g>
</svg>
