<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101820"/><stop offset="1" stop-color="#0b1016"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2632"/><stop offset="1" stop-color="#141d26"/></linearGradient>
    <linearGradient id="fU" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cdd4dc"/></linearGradient>
    <linearGradient id="fF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00b357"/><stop offset="1" stop-color="#007a3c"/></linearGradient>
    <linearGradient id="fR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4a40"/><stop offset="1" stop-color="#c02420"/></linearGradient>
    <filter id="shadow" x1="-20%" y1="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="14"/><feOffset dx="0" dy="16" result="b"/><feFlood flood-color="#000" flood-opacity="0.5"/><feComposite in2="SourceGraphic" operator="in"/></filter>
  </defs>
  <rect width="1280" height="820" fill="url(#bg)"/>
  <text x="40" y="50" fill="#e3ebf3" font-size="22" font-weight="700">Brain</text>
  <text x="40" y="74" fill="#a6b6c6" font-size="13">Practice / Smart cube</text>
  <text x="1240" y="50" fill="#66dfc5" font-size="13" text-anchor="end">idea B · clean cube + flowing scramble (recommended)</text>

  <!-- ===== CLEAN ISOMETRIC CUBE (centered, big) ===== -->
  <!-- top rhombus + two side parallelograms, proper isometric (2:1) -->
  <g transform="translate(640,300)" filter="url(#shadow)">
    <!-- ground shadow -->
    <ellipse cx="0" cy="250" rx="180" ry="34" fill="#000" opacity="0.35"/>
    <!-- TOP (white rhombus) -->
    <polygon points="0,-92 160,0 0,92 -160,0" fill="url(#fU)" stroke="#0c1218" stroke-width="1.5"/>
    <!-- RIGHT (red parallelogram) -->
    <polygon points="160,0 160,140 0,232 0,92" fill="url(#fR)" stroke="#0c1218" stroke-width="1.5"/>
    <!-- LEFT (green parallelogram) -->
    <polygon points="-160,0 -160,140 0,232 0,92" fill="url(#fF)" stroke="#0c1218" stroke-width="1.5"/>
    <!-- subtle 3x3 grid: top -->
    <g stroke="#0c1218" stroke-width="0.8" opacity="0.18">
      <line x1="0" y1="-92" x2="0" y2="92"/>
      <line x1="-160" y1="0" x2="160" y2="0"/>
      <line x1="-53" y1="-31" x2="53" y2="31"/>
      <line x1="53" y1="-31" x2="-53" y2="31"/>
    </g>
    <!-- grid: right face -->
    <g stroke="#0c1218" stroke-width="0.8" opacity="0.18">
      <line x1="160" y1="0" x2="160" y2="140"/>
      <line x1="160" y1="46" x2="0" y2="92"/>
      <line x1="160" y1="93" x2="0" y2="139"/>
      <line x1="53" y1="-31" x2="53" y2="93"/>
      <line x1="106" y1="0" x2="106" y2="124"/>
    </g>
    <!-- grid: left face -->
    <g stroke="#0c1218" stroke-width="0.8" opacity="0.18">
      <line x1="-160" y1="0" x2="-160" y2="140"/>
      <line x1="-160" y1="46" x2="0" y2="92"/>
      <line x1="-160" y1="93" x2="0" y2="139"/>
      <line x1="-53" y1="-31" x2="-53" y2="93"/>
      <line x1="-106" y1="0" x2="-106" y2="124"/>
    </g>
  </g>

  <!-- floating timer + phase chips BESIDE the cube -->
  <g transform="translate(820,250)">
    <rect x="0" y="0" width="190" height="78" rx="16" fill="#1a2632" stroke="#304451"/>
    <circle cx="24" cy="40" r="6" fill="#0f9d58"/>
    <text x="42" y="32" fill="#a6b6c6" font-size="9">LIVE</text>
    <text x="16" y="58" fill="#e3ebf3" font-size="28" font-weight="700">8.42<tspan fill="#a6b6c6" font-size="15"> s</tspan></text>
    <text x="178" y="32" fill="#66dfc5" font-size="11" text-anchor="end">12 mv</text>
    <text x="178" y="52" fill="#66dfc5" font-size="11" text-anchor="end">4.31 TPS</text>
  </g>
  <g transform="translate(270,250)">
    <rect x="0" y="0" width="190" height="50" rx="13" fill="#1a2632" stroke="#304451"/>
    <text x="14" y="20" fill="#a6b6c6" font-size="9">PHASE</text>
    <text x="14" y="40" fill="#e3ebf3" font-size="16" font-weight="700">F2L · 2/4 pairs</text>
  </g>

  <!-- ===== FLOWING SCRAMBLE (under the cube, not boxes) ===== -->
  <g transform="translate(330,560)">
    <text x="0" y="0" fill="#a6b6c6" font-size="10" letter-spacing="1">SCRAMBLE</text>
    <!-- the flow path -->
    <path d="M 20 30 C 90 30 110 30 160 30" fill="none" stroke="#304451" stroke-width="2"/>
    <path d="M 160 30 C 210 30 240 30 300 30 360 30 410 30 470 30 520 30 580 30 620 30" fill="none" stroke="#304451" stroke-width="2"/>
    <!-- completed (dimmed) -->
    <circle cx="20" cy="30" r="5" fill="#3a4754"/>
    <circle cx="80" cy="30" r="5" fill="#3a4754"/>
    <!-- current (highlighted, labeled) -->
    <circle cx="160" cy="30" r="11" fill="#087f75" stroke="#66dfc5" stroke-width="2"/>
    <text x="160" y="11" text-anchor="middle" fill="#66dfc5" font-size="11" font-weight="700">F2</text>
    <!-- future (faint) -->
    <circle cx="240" cy="30" r="4" fill="#2a3744"/>
    <circle cx="300" cy="30" r="4" fill="#2a3744"/>
    <circle cx="360" cy="30" r="4" fill="#2a3744"/>
    <circle cx="410" cy="30" r="4" fill="#2a3744"/>
    <circle cx="470" cy="30" r="4" fill="#2a3744"/>
    <circle cx="520" cy="30" r="4" fill="#2a3744"/>
    <circle cx="580" cy="30" r="4" fill="#2a3744"/>
    <circle cx="620" cy="30" r="4" fill="#2a3744"/>
  </g>

  <!-- ===== slim left rail (collapsible drawers) ===== -->
  <g transform="translate(40,120)">
    <g>
      <rect x="0" y="0" width="220" height="76" rx="14" fill="url(#panel)" stroke="#30404e"/>
      <circle cx="26" cy="38" r="7" fill="#0f9d58"/>
      <text x="46" y="30" fill="#e3ebf3" font-size="12" font-weight="700">GAN16ui_B704</text>
      <text x="46" y="48" fill="#a6b6c6" font-size="10">GAN Gen4 · Disconnect ›</text>
    </g>
    <g transform="translate(0,92)">
      <rect x="0" y="0" width="220" height="120" rx="14" fill="url(#panel)" stroke="#30404e"/>
      <text x="16" y="22" fill="#a6b6c6" font-size="10" letter-spacing="1">SETUP ›</text>
      <g transform="translate(16,34)" font-size="11">
        <rect x="0" y="0" width="92" height="26" rx="7" fill="#22313e"/><rect x="2" y="2" width="44" height="22" rx="5" fill="#304451"/><text x="24" y="17" text-anchor="middle" fill="#e3ebf3">Guided</text><text x="70" y="17" text-anchor="middle" fill="#a6b6c6">Free</text>
        <rect x="104" y="0" width="92" height="26" rx="7" fill="#22313e"/><text x="120" y="17" text-anchor="middle" fill="#a6b6c6">Cross</text><text x="166" y="17" text-anchor="middle" fill="#a6b6c6">X</text><text x="186" y="17" text-anchor="middle" fill="#a6b6c6">2X</text>
      </g>
      <g transform="translate(16,72)" font-size="10" fill="#a6b6c6"><rect x="0" y="0" width="12" height="12" rx="3" fill="none" stroke="#66dfc5"/><text x="18" y="10" fill="#e3ebf3">Pseudo F2L</text>
      <rect x="110" y="0" width="12" height="12" rx="3" fill="#087f75" stroke="#66dfc5"/><text x="128" y="10" fill="#e3ebf3">Inspect 15s</text></g>
    </g>
    <g transform="translate(0,228)">
      <rect x="0" y="0" width="220" height="44" rx="14" fill="url(#panel)" stroke="#30404e"/>
      <text x="16" y="27" fill="#a6b6c6" font-size="11">▸ Coach insights</text>
    </g>
    <g transform="translate(0,284)">
      <rect x="0" y="0" width="220" height="44" rx="14" fill="url(#panel)" stroke="#30404e"/>
      <text x="16" y="27" fill="#a6b6c6" font-size="11">▸ Metrics · 12 solves · 8.42s best</text>
    </g>
    <g transform="translate(0,340)">
      <rect x="0" y="0" width="220" height="44" rx="14" fill="url(#panel)" stroke="#30404e"/>
      <text x="16" y="27" fill="#a6b6c6" font-size="11">▸ Diagnostics</text>
    </g>
  </g>

  <!-- ===== PHONE: bottom tab bar ===== -->
  <g transform="translate(990,640)">
    <rect x="0" y="0" width="220" height="160" rx="14" fill="none" stroke="#304451" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="6" y="16" fill="#a6b6c6" font-size="9">PHONE</text>
    <rect x="14" y="28" width="192" height="64" rx="6" fill="#19242f" opacity="0.5"/>
    <text x="110" y="64" text-anchor="middle" fill="#a6b6c6" font-size="9">cube fills the screen</text>
    <g transform="translate(14,98)">
      <rect x="0" y="0" width="192" height="28" rx="10" fill="#22313e"/>
      <g font-size="9" fill="#a6b6c6"><text x="30" y="18" text-anchor="middle">Setup</text><text x="78" y="18" text-anchor="middle" fill="#66dfc5">Coach</text><text x="126" y="18" text-anchor="middle">Metrics</text><text x="170" y="18" text-anchor="middle">Connect</text></g>
    </g>
  </g>
</svg>
