<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101820"/><stop offset="1" stop-color="#0c1218"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2632"/><stop offset="1" stop-color="#141d26"/></linearGradient>
    <linearGradient id="cubeU" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d8dee4"/></linearGradient>
    <linearGradient id="cubeF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00b357"/><stop offset="1" stop-color="#00803f"/></linearGradient>
    <linearGradient id="cubeR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4a40"/><stop offset="1" stop-color="#c82620"/></linearGradient>
    <filter id="shadow" x1="-30%" y1="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>
  <rect width="1280" height="820" fill="url(#bg)"/>
  <text x="40" y="50" fill="#e3ebf3" font-size="22" font-weight="700">Brain</text>
  <text x="40" y="74" fill="#a6b6c6" font-size="13">Practice / Smart cube</text>
  <text x="1240" y="50" fill="#66dfc5" font-size="13" text-anchor="end">idea B · floating HUD chips + tab bar</text>

  <!-- ===== BIG CUBE, centered, dominant ===== -->
  <g transform="translate(640,300)" filter="url(#shadow)">
    <g transform="skewY(-26) scale(1.15)">
      <polygon points="0,-150 260,0 0,150 -260,0" fill="url(#cubeU)" stroke="#0c1218" stroke-width="1.5"/>
      <polygon points="-260,0 0,150 -260,0 -130,-75 130,-75" fill="url(#cubeF)" stroke="#0c1218" stroke-width="1.5"/>
      <polygon points="260,0 0,150 260,0 130,-75 -130,-75" fill="url(#cubeR)" stroke="#0c1218" stroke-width="1.5"/>
    </g>
  </g>

  <!-- floating HUD chips directly on the cube stage (beside the cube) -->
  <!-- timer top-right -->
  <g transform="translate(820,150)">
    <rect x="0" y="0" width="180" height="70" rx="16" fill="#1a2632" stroke="#304451"/>
    <circle cx="22" cy="35" r="6" fill="#0f9d58"/>
    <text x="38" y="30" fill="#a6b6c6" font-size="9">LIVE</text>
    <text x="14" y="56" fill="#e3ebf3" font-size="26" font-weight="700">8.42<tspan fill="#a6b6c6" font-size="14">s</tspan></text>
    <text x="170" y="30" fill="#66dfc5" font-size="11" text-anchor="end">12 mv</text>
    <text x="170" y="50" fill="#66dfc5" font-size="11" text-anchor="end">4.31 TPS</text>
  </g>
  <!-- phase chip top-left of cube -->
  <g transform="translate(300,150)">
    <rect x="0" y="0" width="180" height="46" rx="12" fill="#1a2632" stroke="#304451"/>
    <text x="14" y="20" fill="#a6b6c6" font-size="9">PHASE</text>
    <text x="14" y="38" fill="#e3ebf3" font-size="14" font-weight="700">F2L · 2/4</text>
  </g>

  <!-- scramble cue directly under the cube -->
  <g transform="translate(360,500)">
    <text x="0" y="0" fill="#a6b6c6" font-size="10" letter-spacing="1">SCRAMBLE · next move</text>
    <g transform="translate(0,16)" font-size="15" fill="#e3ebf3" font-weight="600">
      <g><rect x="0" y="0" width="42" height="36" rx="8" fill="#1a2632" stroke="#304451"/><text x="21" y="23" text-anchor="middle" fill="#7f8c9b" text-decoration="line-through">R</text></g>
      <g><rect x="50" y="0" width="42" height="36" rx="8" fill="#1a2632" stroke="#304451"/><text x="71" y="23" text-anchor="middle" fill="#7f8c9b" text-decoration="line-through">U</text></g>
      <g><rect x="100" y="0" width="42" height="36" rx="8" fill="#1a2632" stroke="#087f75" stroke-width="2.5"/><text x="121" y="23" text-anchor="middle" fill="#e3ebf3">F2</text></g>
      <g><rect x="150" y="0" width="42" height="36" rx="8" fill="#1a2632" stroke="#304451"/><text x="171" y="23" text-anchor="middle">D</text></g>
      <text x="206" y="24" fill="#a6b6c6" font-size="13">…</text>
    </g>
  </g>

  <!-- ===== slim left icon rail (collapsible drawers) ===== -->
  <g transform="translate(40,120)">
    <!-- connection icon -->
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="220" height="76" rx="14" fill="url(#panel)" stroke="#30404e"/>
      <circle cx="26" cy="38" r="7" fill="#0f9d58"/>
      <text x="46" y="30" fill="#e3ebf3" font-size="12" font-weight="700">GAN16ui_B704</text>
      <text x="46" y="48" fill="#a6b6c6" font-size="10">GAN Gen4 · Disconnect ›</text>
    </g>
    <!-- setup (compact, expands) -->
    <g transform="translate(0,92)">
      <rect x="0" y="0" width="220" height="120" rx="14" fill="url(#panel)" stroke="#30404e"/>
      <text x="16" y="22" fill="#a6b6c6" font-size="10" letter-spacing="1">SETUP ›</text>
      <g transform="translate(16,34)" font-size="11">
        <rect x="0" y="0" width="92" height="26" rx="7" fill="#22313e"/><rect x="2" y="2" width="44" height="22" rx="5" fill="#304451"/><text x="24" y="17" text-anchor="middle" fill="#e3ebf3">Guided</text><text x="70" y="17" text-anchor="middle" fill="#a6b6c6">Free</text>
        <rect x="104" y="0" width="92" height="26" rx="7" fill="#22313e"/><text x="120" y="17" text-anchor="middle" fill="#a6b6c6">Cross</text><text x="166" y="17" text-anchor="middle" fill="#a6b6c6">X</text><text x="186" y="17" text-anchor="middle" fill="#a6b6c6">2X</text>
      </g>
      <g transform="translate(16,72)" font-size="10" fill="#a6b6c6"><rect x="0" y="0" width="12" height="12" rx="3" fill="none" stroke="#66dfc5"/><text x="18" y="10" fill="#e3ebf3">Pseudo F2L</text>
      <rect x="110" y="0" width="12" height="12" rx="3" fill="#087f75" stroke="#66dfc5"/><text x="128" y="10" fill="#e3ebf3">Inspect 15s</text></g>
    </g>
    <!-- coach drawer -->
    <g transform="translate(0,228)">
      <rect x="0" y="0" width="220" height="44" rx="14" fill="url(#panel)" stroke="#30404e"/>
      <text x="16" y="27" fill="#a6b6c6" font-size="11">▸ Coach insights</text>
    </g>
    <!-- metrics drawer -->
    <g transform="translate(0,284)">
      <rect x="0" y="0" width="220" height="44" rx="14" fill="url(#panel)" stroke="#30404e"/>
      <text x="16" y="27" fill="#a6b6c6" font-size="11">▸ Metrics · 12 solves</text>
    </g>
    <!-- diagnostics drawer -->
    <g transform="translate(0,340)">
      <rect x="0" y="0" width="220" height="44" rx="14" fill="url(#panel)" stroke="#30404e"/>
      <text x="16" y="27" fill="#a6b6c6" font-size="11">▸ Diagnostics</text>
    </g>
  </g>

  <!-- ===== PHONE: bottom tab bar ===== -->
  <g transform="translate(990,640)">
    <rect x="0" y="0" width="220" height="160" rx="14" fill="none" stroke="#304451" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="6" y="16" fill="#a6b6c6" font-size="9">PHONE · bottom tabs</text>
    <rect x="14" y="28" width="192" height="64" rx="6" fill="#19242f" opacity="0.5"/>
    <text x="110" y="64" text-anchor="middle" fill="#a6b6c6" font-size="9">cube fills screen</text>
    <!-- bottom tab bar -->
    <g transform="translate(14,98)">
      <rect x="0" y="0" width="192" height="28" rx="10" fill="#22313e"/>
      <g font-size="9" fill="#a6b6c6"><text x="30" y="18" text-anchor="middle">Setup</text><text x="78" y="18" text-anchor="middle" fill="#66dfc5">Coach</text><text x="126" y="18" text-anchor="middle">Metrics</text><text x="170" y="18" text-anchor="middle">Connect</text></g>
    </g>
  </g>
</svg>
