<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101820"/><stop offset="1" stop-color="#0c1218"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#19242f"/><stop offset="1" stop-color="#141d26"/></linearGradient>
    <linearGradient id="cubeU" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d8dee4"/></linearGradient>
    <linearGradient id="cubeF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00b357"/><stop offset="1" stop-color="#00803f"/></linearGradient>
    <linearGradient id="cubeR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4a40"/><stop offset="1" stop-color="#c82620"/></linearGradient>
    <filter id="shadow" x1="-30%" y1="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1280" height="820" fill="url(#bg)"/>
  <!-- title -->
  <text x="40" y="50" fill="#e3ebf3" font-size="22" font-weight="700">Brain</text>
  <text x="40" y="74" fill="#a6b6c6" font-size="13">Practice / Smart cube</text>
  <text x="1240" y="50" fill="#66dfc5" font-size="13" text-anchor="end">idea A · cube hero + right rail</text>

  <!-- ===== CUBE HERO (left) ===== -->
  <g transform="translate(360,150)" filter="url(#shadow)">
    <!-- isometric cube -->
    <g transform="skewY(-30)">
      <!-- top U white -->
      <polygon points="0,-110 190,0 0,110 -190,0" fill="url(#cubeU)" stroke="#0c1218" stroke-width="1.5"/>
      <!-- front F green -->
      <polygon points="-190,0 0,110 -190,0 -95,-55 95,-55" fill="url(#cubeF)" stroke="#0c1218" stroke-width="1.5"/>
      <!-- right R red -->
      <polygon points="190,0 0,110 190,0 95,-55 -95,-55" fill="url(#cubeR)" stroke="#0c1218" stroke-width="1.5"/>
      <!-- sticker grid hints -->
      <g stroke="#0c1218" stroke-width="1" opacity="0.25">
        <line x1="-63" y1="-37" x2="63" y2="37"/><line x1="63" y1="-37" x2="-63" y2="37"/>
        <line x1="-63" y1="33" x2="0" y2="-33"/><line x1="63" y1="33" x2="0" y2="-33"/>
        <line x1="-63" y1="-28" x2="-63" y2="28"/><line x1="63" y1="-28" x2="63" y2="28"/>
      </g>
    </g>
  </g>
  <text x="360" y="470" fill="#a6b6c6" font-size="12">White top · Green front · Red right</text>
  <text x="360" y="488" fill="#a6b6c6" font-size="11" text-decoration="underline">Reset view</text>

  <!-- timer chip floating beside cube -->
  <g transform="translate(560,150)">
    <rect x="0" y="0" width="150" height="64" rx="14" fill="#19242f" stroke="#304451" stroke-width="1"/>
    <text x="16" y="26" fill="#a6b6c6" font-size="10">LIVE</text>
    <text x="16" y="50" fill="#e3ebf3" font-size="22" font-weight="700">8.42<tspan fill="#a6b6c6" font-size="13">s</tspan></text>
    <text x="150" y="26" fill="#66dfc5" font-size="11" text-anchor="end">12 mv · 4.31 TPS</text>
  </g>

  <!-- scramble strip under cube (same component) -->
  <g transform="translate(120,510)">
    <text x="0" y="0" fill="#a6b6c6" font-size="11" letter-spacing="1">SCRAMBLE</text>
    <g transform="translate(0,16)" font-size="14" fill="#e3ebf3" font-weight="600">
      <g><rect x="0" y="0" width="40" height="34" rx="7" fill="#19242f" stroke="#304451"/><text x="20" y="22" text-anchor="middle" fill="#7f8c9b">R</text></g>
      <g><rect x="48" y="0" width="40" height="34" rx="7" fill="#19242f" stroke="#304451"/><text x="68" y="22" text-anchor="middle" fill="#7f8c9b" text-decoration="line-through">U</text></g>
      <g><rect x="96" y="0" width="40" height="34" rx="7" fill="#19242f" stroke="#304451"/><text x="116" y="22" text-anchor="middle" fill="#7f8c9b" text-decoration="line-through">R'</text></g>
      <g><rect x="144" y="0" width="40" height="34" rx="7" fill="#19242f" stroke="#087f75" stroke-width="2"/><text x="164" y="22" text-anchor="middle" fill="#e3ebf3">F2</text></g>
      <g><rect x="192" y="0" width="40" height="34" rx="7" fill="#19242f" stroke="#304451"/><text x="212" y="22" text-anchor="middle">D</text></g>
      <g><rect x="240" y="0" width="40" height="34" rx="7" fill="#19242f" stroke="#304451"/><text x="260" y="22" text-anchor="middle">L'</text></g>
      <text x="292" y="22" fill="#a6b6c6" font-size="13">… 6 / 21</text>
    </g>
  </g>

  <!-- ===== RIGHT RAIL ===== -->
  <g transform="translate(820,96)">
    <!-- connection -->
    <g>
      <rect x="0" y="0" width="400" height="60" rx="14" fill="url(#panel)" stroke="#30404e"/>
      <text x="16" y="24" fill="#e3ebf3" font-size="13" font-weight="700">GAN16ui_B704</text>
      <text x="16" y="42" fill="#a6b6c6" font-size="11">GAN Gen4 · connected</text>
      <g transform="translate(300,16)" font-size="11">
        <rect x="0" y="0" width="80" height="28" rx="8" fill="#19242f" stroke="#30404e"/><text x="40" y="18" text-anchor="middle" fill="#e3ebf3">Disconnect</text>
      </g>
    </g>

    <!-- setup -->
    <g transform="translate(0,76)">
      <rect x="0" y="0" width="400" height="118" rx="14" fill="url(#panel)" stroke="#30404e"/>
      <text x="16" y="22" fill="#a6b6c6" font-size="10" letter-spacing="1">SETUP</text>
      <!-- segmented controls -->
      <g transform="translate(16,32)" font-size="11">
        <rect x="0" y="0" width="120" height="30" rx="8" fill="#22313e"/><rect x="2" y="2" width="56" height="26" rx="6" fill="#304451"/><text x="30" y="19" text-anchor="middle" fill="#e3ebf3">Guided</text><text x="90" y="19" text-anchor="middle" fill="#a6b6c6">Free</text>
        <rect x="132" y="0" width="170" height="30" rx="8" fill="#22313e"/><rect x="134" y="2" width="54" height="26" rx="6" fill="#304451"/><text x="161" y="19" text-anchor="middle" fill="#e3ebf3">Cross</text><text x="220" y="19" text-anchor="middle" fill="#a6b6c6">X-cross</text><text x="270" y="19" text-anchor="middle" fill="#a6b6c6">2X</text>
      </g>
      <g transform="translate(16,72)" font-size="11" fill="#a6b6c6">
        <rect x="0" y="0" width="14" height="14" rx="3" fill="none" stroke="#66dfc5"/><text x="22" y="11" fill="#e3ebf3">Pseudo F2L · D-shift</text>
        <rect x="150" y="0" width="14" height="14" rx="3" fill="#087f75" stroke="#66dfc5"/><text x="172" y="11" fill="#e3ebf3">Inspection · 15s</text>
      </g>
    </g>

    <!-- phase -->
    <g transform="translate(0,206)">
      <rect x="0" y="0" width="400" height="96" rx="14" fill="url(#panel)" stroke="#30404e"/>
      <text x="16" y="22" fill="#a6b6c6" font-size="10" letter-spacing="1">PHASE</text>
      <text x="16" y="46" fill="#e3ebf3" font-size="18" font-weight="700">F2L · 2/4 pairs</text>
      <!-- timeline -->
      <g transform="translate(16,58)">
        <rect x="0" y="0" width="90" height="22" rx="6" fill="#0f9d58"/><text x="45" y="15" text-anchor="middle" fill="#fff" font-size="10">Cross</text>
        <rect x="96" y="0" width="90" height="22" rx="6" fill="#304451"/><text x="141" y="15" text-anchor="middle" fill="#a6b6c6" font-size="10">F2L 2/4</text>
        <rect x="192" y="0" width="90" height="22" rx="6" fill="#19242f" stroke="#30404e"/><text x="237" y="15" text-anchor="middle" fill="#a6b6c6" font-size="10">OLL</text>
        <rect x="288" y="0" width="90" height="22" rx="6" fill="#19242f" stroke="#30404e"/><text x="333" y="15" text-anchor="middle" fill="#a6b6c6" font-size="10">PLL</text>
      </g>
    </g>

    <!-- coach -->
    <g transform="translate(0,316)">
      <rect x="0" y="0" width="400" height="150" rx="14" fill="url(#panel)" stroke="#30404e"/>
      <text x="16" y="22" fill="#a6b6c6" font-size="10" letter-spacing="1">COACH</text>
      <g transform="translate(16,34)" font-size="11" fill="#e3ebf3">
        <rect x="0" y="0" width="368" height="26" rx="8" fill="rgba(15,157,88,.10)" stroke="#0f9d58"/><text x="10" y="17" fill="#83e7b3">✓ Optimal cross: White face in 5 moves.</text>
        <rect x="0" y="32" width="368" height="26" rx="8" fill="rgba(224,168,0,.10)" stroke="#e0a800"/><text x="10" y="49" fill="#ffd27a">Your D cross took 7 moves. Optimal is 5. 2 extra.</text>
        <rect x="0" y="64" width="368" height="26" rx="8" fill="#19242f" stroke="#30404e"/><text x="10" y="81">The FR pair is already connected — insert it.</text>
        <rect x="0" y="96" width="368" height="26" rx="8" fill="#19242f" stroke="#30404e"/><text x="10" y="113">PLL: T · One adjacent pair of headlights…</text>
      </g>
    </g>

    <!-- metrics -->
    <g transform="translate(0,480)">
      <rect x="0" y="0" width="400" height="92" rx="14" fill="url(#panel)" stroke="#30404e"/>
      <text x="16" y="22" fill="#a6b6c6" font-size="10" letter-spacing="1">METRICS</text>
      <g transform="translate(16,32)" font-size="11" fill="#e3ebf3">
        <g><text x="0" y="10" fill="#a6b6c6" font-size="9">SOLVES</text><text x="0" y="30" font-size="16" font-weight="700">12</text></g>
        <g><text x="68" y="10" fill="#a6b6c6" font-size="9">BEST</text><text x="68" y="30" font-size="16" font-weight="700">8.42s</text></g>
        <g><text x="140" y="10" fill="#a6b6c6" font-size="9">AO5</text><text x="140" y="30" font-size="16" font-weight="700">9.10s</text></g>
        <g><text x="210" y="10" fill="#a6b6c6" font-size="9">AO12</text><text x="210" y="30" font-size="16" font-weight="700">9.30s</text></g>
        <g><text x="288" y="10" fill="#a6b6c6" font-size="9">MED TPS</text><text x="288" y="30" font-size="16" font-weight="700">4.31</text></g>
      </g>
    </g>

    <!-- collapsible coach settings -->
    <g transform="translate(0,586)">
      <rect x="0" y="0" width="400" height="34" rx="14" fill="url(#panel)" stroke="#30404e"/>
      <text x="16" y="21" fill="#a6b6c6" font-size="11">▸ Coach settings</text>
    </g>

    <!-- primary start -->
    <g transform="translate(0,632)">
      <rect x="0" y="0" width="400" height="44" rx="11" fill="#087f75"/>
      <text x="200" y="28" text-anchor="middle" fill="#102923" font-size="14" font-weight="700">Start guided solve</text>
    </g>
  </g>

  <!-- phone inset -->
  <g transform="translate(40,640)">
    <rect x="0" y="0" width="200" height="160" rx="14" fill="none" stroke="#304451" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="6" y="16" fill="#a6b6c6" font-size="9">PHONE</text>
    <rect x="14" y="30" width="172" height="86" rx="6" fill="#19242f" opacity="0.5"/>
    <text x="100" y="74" text-anchor="middle" fill="#a6b6c6" font-size="9">cube fills width</text>
    <rect x="14" y="122" width="172" height="28" rx="10" fill="#087f75" opacity="0.85"/>
    <text x="100" y="140" text-anchor="middle" fill="#102923" font-size="9" font-weight="700">Start</text>
  </g>
</svg>
