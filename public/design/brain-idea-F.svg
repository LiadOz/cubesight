<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e1620"/><stop offset="1" stop-color="#0a0f16"/></linearGradient>
    <linearGradient id="fU" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cdd4dc"/></linearGradient>
    <linearGradient id="fF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00b357"/><stop offset="1" stop-color="#007a3c"/></linearGradient>
    <linearGradient id="fR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4a40"/><stop offset="1" stop-color="#c02420"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#087f75" stop-opacity="0.18"/><stop offset="1" stop-color="#087f75" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x1="-20%" y1="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="16"/><feOffset dx="0" dy="18" result="b"/><feFlood flood-color="#000" flood-opacity="0.55"/><feComposite in2="SourceGraphic" operator="in"/></filter>
  </defs>
  <rect width="1280" height="820" fill="url(#bg)"/>
  <!-- soft glow behind the cube -->
  <ellipse cx="640" cy="300" rx="300" ry="220" fill="url(#glow)"/>

  <!-- title only — no header bar / card -->
  <text x="40" y="56" fill="#e3ebf3" font-size="20" font-weight="700" letter-spacing="0.5">Brain</text>
  <text x="1240" y="56" fill="#66dfc5" font-size="11" text-anchor="end">idea F · fluent — no cards</text>

  <!-- connect: a single floating chip, top-right (not a panel) -->
  <g transform="translate(1080,90)">
    <rect x="0" y="0" width="150" height="40" rx="20" fill="#14222e" stroke="#26384a"/>
    <circle cx="22" cy="20" r="6" fill="#0f9d58"/>
    <text x="38" y="25" fill="#e3ebf3" font-size="12" font-weight="600">Connect cube</text>
  </g>

  <!-- ===== HERO CUBE (huge, centered, no boxes around it) ===== -->
  <g transform="translate(640,300)" filter="url(#shadow)">
    <ellipse cx="0" cy="250" rx="200" ry="38" fill="#000" opacity="0.4"/>
    <polygon points="0,-104 180,0 0,104 -180,0" fill="url(#fU)" stroke="#0c1218" stroke-width="1.5"/>
    <polygon points="180,0 180,156 0,260 0,104" fill="url(#fR)" stroke="#0c1218" stroke-width="1.5"/>
    <polygon points="-180,0 -180,156 0,260 0,104" fill="url(#fF)" stroke="#0c1218" stroke-width="1.5"/>
    <g stroke="#0c1218" stroke-width="0.8" opacity="0.18"><line x1="0" y1="-104" x2="0" y2="104"/><line x1="-180" y1="0" x2="180" y2="0"/><line x1="-60" y1="-35" x2="60" y2="35"/><line x1="60" y1="-35" x2="-60" y2="35"/></g>
  </g>

  <!-- timer + phase as FLOATING TEXT beside the cube (no boxes) -->
  <g transform="translate(860,250)">
    <text x="0" y="0" fill="#a6b6c6" font-size="9" letter-spacing="1">LIVE</text>
    <text x="0" y="26" fill="#e3ebf3" font-size="30" font-weight="700">8.42<tspan fill="#a6b6c6" font-size="15"> s</tspan></text>
    <text x="0" y="50" fill="#66dfc5" font-size="11">12 turns · 4.31 TPS</text>
  </g>
  <g transform="translate(360,250)">
    <text x="0" y="0" fill="#a6b6c6" font-size="9" letter-spacing="1">PHASE</text>
    <text x="0" y="24" fill="#e3ebf3" font-size="22" font-weight="700">F2L · 2/4</text>
  <text x="0" y="48" fill="#66dfc5" font-size="11">cross done · building pairs</text>
  </g>

  <!-- flowing scramble under the cube (still a flow, not boxes) -->
  <g transform="translate(330,580)">
    <path d="M 20 20 C 90 20 110 20 160 20" fill="none" stroke="#2a3744" stroke-width="2"/>
    <path d="M 160 20 C 210 20 240 20 300 20 360 20 410 20 470 20 520 20 580 20 620 20" fill="none" stroke="#2a3744" stroke-width="2"/>
    <circle cx="20" cy="20" r="4" fill="#3a4754"/><circle cx="80" cy="20" r="4" fill="#3a4754"/>
    <circle cx="160" cy="20" r="9" fill="#087f75"/>
    <text x="160" y="3" text-anchor="middle" fill="#66dfc5" font-size="10" font-weight="700">F2</text>
    <circle cx="240" cy="20" r="3.5" fill="#2a3744"/><circle cx="300" cy="20" r="3.5" fill="#2a3744"/><circle cx="360" cy="20" r="3.5" fill="#2a3744"/><circle cx="410" cy="20" r="3.5" fill="#2a3744"/><circle cx="470" cy="20" r="3.5" fill="#2a3744"/><circle cx="520" cy="20" r="3.5" fill="#2a3744"/><circle cx="580" cy="20" r="3.5" fill="#2a3744"/><circle cx="620" cy="20" r="3.5" fill="#2a3744"/>
  </g>

  <!-- ===== ONE continuous translucent glass surface (NO internal borders = no cards).
       Sections separated only by eyebrow labels + spacing, not boxes. ===== -->
  <g transform="translate(200,640)">
    <!-- a single rounded translucent panel with NO internal card borders -->
    <rect x="0" y="0" width="880" height="150" rx="22" fill="#111c26" opacity="0.92"/>
    <!-- timeline: a thin glowing line along the top of the surface, dot = current stage (NOT chips) -->
    <g transform="translate(28,24)">
      <line x1="0" y1="8" x2="824" y2="8" stroke="#26384a" stroke-width="2"/>
      <line x1="0" y1="8" x2="206" y2="8" stroke="#087f75" stroke-width="3"/>
      <circle cx="206" cy="8" r="6" fill="#087f75"/>
      <g font-size="9" fill="#5a6c79"><text x="0" y="28">Scramble</text><text x="165" y="28" fill="#a6b6c6">Cross</text><text x="330" y="28" fill="#5a6c79">F2L</text><text x="495" y="28" fill="#5a6c79">OLL</text><text x="660" y="28" fill="#5a6c79">PLL</text><text x="824" y="28" text-anchor="end" fill="#5a6c79">Solved</text></g>
    </g>
    <!-- sections separated by eyebrow labels + spacing only — no boxes/borders -->
    <g transform="translate(28,52)" fill="#e3ebf3">
      <text x="0" y="0" fill="#5a6c79" font-size="9" letter-spacing="1.5">COACH</text>
      <text x="0" y="18" fill="#83e7b3" font-size="11">✓ Optimal cross: White face in 5 moves.</text>
      <text x="0" y="36" fill="#ffd27a" font-size="11">Your D cross: 7 moves · optimal 5.</text>
      <text x="0" y="54" font-size="11">FR pair already connected — insert it.   ·   PLL: T · one adjacent pair of headlights…</text>
    </g>
    <g transform="translate(28,98)" fill="#e3ebf3">
      <text x="0" y="0" fill="#5a6c79" font-size="9" letter-spacing="1.5">METRICS</text>
      <text x="0" y="18" font-size="12">12 solves · best 8.42s · ao5 9.10s · ao12 9.30s · 4.31 TPS · 54 moves</text>
    </g>
    <!-- start: a text link in the surface, not a chunky button -->
    <text x="852" y="116" fill="#66dfc5" font-size="12" font-weight="600" text-anchor="end" text-decoration="underline">Start guided solve ›</text>
  </g>
</svg>
