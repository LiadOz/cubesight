[package]
name = "corner-recognition-core"
version = "0.1.0"
edition = "2021"
description = "Deterministic corner-recognition training logic for the web"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
lto = true
opt-level = "s"
