name: test health

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  playwright-shards:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:shard
        env:
          PLAYWRIGHT_SHARD_INDEX: ${{ matrix.shard }}
          PLAYWRIGHT_SHARD_COUNT: 4
          CUBESIGHT_IMPACT_COVERAGE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-health-playwright-${{ matrix.shard }}
          path: |
            test-results/shards/
            test-results/impact-map/raw/
          if-no-files-found: ignore

  health-and-flakes:
    needs: playwright-shards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          pattern: test-health-playwright-*
          path: test-results/
          merge-multiple: true
      - run: npm run test:health
      - run: npm run test:flaky
      - run: npm run test:impact-map -- --from-raw
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-health-${{ github.run_id }}
          path: |
            test-results/health/
            test-results/impact-map/
            tests/impact-map.json
          if-no-files-found: ignore
