name: test health

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  health-and-flakes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:health
      - run: npm run test:flaky
      - run: npm run test:impact-map
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-health-${{ github.run_id }}
          path: |
            test-results/health/
            test-results/impact-map/
            tests/impact-map.json
          if-no-files-found: ignore
